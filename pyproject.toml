[project]
name = "pystream"
version = "1.0.0"
description = "Real-time multi-monitor screen sharing for classrooms — with group chat, voice chat, and fine-grained access control"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["screen-sharing", "classroom", "fastapi", "websocket", "teaching"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "mss>=9.0.0",
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "pillow>=10.0.0",
    "pyautogui>=0.9.54",
    "websockets>=12.0",
]

[project.urls]
Repository = "https://github.com/Mcoder9/pystream"
Issues     = "https://github.com/Mcoder9/pystream/issues"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"
